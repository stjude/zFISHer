# Runs the test suite on GitHub's servers for every push and pull request,
# and for the release workflow before it creates a release.
name: Tests

on:
  push:
    branches: ["**"]     # not tags: the release workflow runs the tests for those
  pull_request:
  workflow_call:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # No display: Qt renders offscreen, as in local headless runs.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries Qt needs offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      # The CPU build of the pinned torch, so pip does not pull the much larger
      # CUDA build that pyproject.toml's torch pin would otherwise resolve to.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install zFISHer
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest tests -q -rfE --junitxml=test-results.xml

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
