# Makes a DRAFT GitHub release whose notes are that version's CHANGELOG.md
# section. It runs when:
#
# - a merge into main changes the version in zfisher/version.py to one with no
#   tag yet (a release prepared with .github/scripts/prepare_release.py): the
#   merge commit is tagged here, so nobody has to tag by hand; or
# - a version tag is pushed (git push origin v2.1.2), as before.
#
# Either way it runs the tests, checks the tag against zfisher/version.py,
# CITATION.cff and CHANGELOG.md, and creates the draft. Merges into main that
# leave the version alone do nothing. Nothing is published until someone
# reviews the draft and clicks Publish.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # every tag, to see whether this version has one

      - name: Decide whether this push makes a release
        id: plan
        run: python3 .github/scripts/release_plan.py "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  tests:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml

  draft-release:
    needs: [plan, tests]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check the tag and take the release notes from CHANGELOG.md
        run: python .github/scripts/release_notes.py "$TAG" > notes.md

      # Only after the check, so a release that fails it leaves no tag behind.
      # A tag pushed with this workflow's token does not start the workflow
      # again.
      - name: Tag the merge commit
        if: github.ref_type == 'branch'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "zFISHer ${TAG#v}" --notes-file notes.md
