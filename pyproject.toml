[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zfisher"
dynamic = ["version"]
description = "3D colocalization analysis for multiplexed sequential FISH, built on napari"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
authors = [
    {name = "Seth Staller", email = "Seth.Staller@STJUDE.ORG"},
]
keywords = ["FISH", "colocalization", "napari", "microscopy", "3D", "segmentation", "registration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "napari[optional]==0.6.6",
    "PySide6==6.8.1",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-image==0.24.0",
    "pandas==2.3.3",
    "tifffile==2025.2.18",
    "magicgui==0.10.1",
    "SimpleITK==2.5.3",
    "cellpose==4.0.8",
    # Pin torch explicitly: cellpose only requires torch>=1.6, so a fresh pip
    # install would otherwise pull a too-new torch that fails to import on
    # Python 3.10 (torch.distributed._pycute uses a 3.11+ `Self | int` annotation).
    "torch==2.3.1",
    "torchvision==0.18.1",
    "nd2==0.11.2",
    "openpyxl==3.1.5",
    "markdown==3.10.2",
    "packaging==26.0",
    "qtpy==2.4.3",
    "Pillow==12.0.0",
    # Memory figures in the session log's STAGE and ENV lines.
    "psutil==7.2.2",
    # The typed setting models (zfisher/core/params.py); napari needs pydantic 2 as well.
    "pydantic>=2.4,<3",
    # zfisher-cli; napari needs it as well.
    "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/stjude/zFISHer"
Repository = "https://github.com/stjude/zFISHer"
Issues = "https://github.com/stjude/zFISHer/issues"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/zfisher-mcp/tests"]
addopts = "-q"
# The repository root, so tests import this checkout's zfisher even when it is
# not installed, and tests/, so tests can share fixtures from sibling modules.
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["_legacy", "build"]

[tool.ruff.lint]
# Errors pyflakes and the parser catch: unused or undefined names, imports that
# shadow each other, syntax errors. Style rules (import order, whitespace,
# one statement per line) are left for a formatting-only change.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from a sibling test module are used as test arguments,
# which pyflakes reads as redefinitions.
"tests/*" = ["F811"]
"packages/*/tests/*" = ["F811"]

[project.scripts]
zfisher = "zfisher.__main__:main"
zfisher-cli = "zfisher.cli:main"

[tool.setuptools.dynamic]
version = {attr = "zfisher.version.__version__"}

[tool.setuptools.packages.find]
include = ["zfisher*"]

[tool.setuptools.package-data]
zfisher = ["resources/*.ico", "resources/*.png", "resources/icons/*.svg"]
